name: GitHub Pages

on:
  push:
    branches: [ "main" ]
    paths:
      - "docs/**"
      - "CHANGELOG.md"
      - "tests/test_llms_release_version.sh"
      - "tests/test_docs_site.py"
      - ".github/workflows/pages.yml"
  pull_request:
    paths:
      - "docs/**"
      - "README.md"
      - "CHANGELOG.md"
      - "tests/test_llms_release_version.sh"
      - "tests/test_docs_site.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "pages-${{ github.event_name }}-${{ github.ref }}"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check docs release freshness
        run: bash tests/test_llms_release_version.sh
      - uses: actions/configure-pages@v5
        if: github.event_name != 'pull_request'
      - uses: actions/jekyll-build-pages@v1
        with:
          source: docs
          destination: _site
      - name: Check rendered documentation
        run: python3 tests/test_docs_site.py _site
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
