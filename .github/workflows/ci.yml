name: CI

on:
  push:
    branches:
      - main
      - "automation/ffmpeg-sync/**"
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:
    inputs:
      publish_nightly:
        type: boolean
        description: "Publish/overwrite the nightly release"
        default: false
  schedule:
    - cron: "0 6 * * *"

permissions:
  contents: read

env:
  FFMPEG_CONFIGURE_FLAGS: >-
    --enable-gpl
    --enable-liblz4
    --enable-libzstd
    --enable-libopus
    --enable-libvorbis
    --enable-libmp3lame
    --enable-libaom
    --enable-libdav1d
    --enable-libsvtav1
    --enable-libx264
    --enable-libx265
    --enable-libvpx
    --enable-libvmaf
    --enable-libass
    --enable-libfreetype
    --enable-libfontconfig
    --enable-libfribidi
    --enable-libharfbuzz
    --enable-libxml2
    --enable-libzimg
    --enable-libwebp
    --enable-ffplay
    --enable-videotoolbox-remote
    --disable-debug

jobs:
  # Jobs using videotoolbox-remote-runner execute repository code on self-hosted
  # Linux infrastructure. PR-triggered self-hosted jobs must include the trusted
  # author guard used by ffmpeg-build-linux and obs-plugin. github-actions[bot]
  # is reserved for first-party automation PRs if that path is added later.
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      ffmpeg: ${{ github.event_name == 'schedule' && steps.schedule_changes.outputs.ffmpeg || steps.filter.outputs.ffmpeg }}
      vtremoted: ${{ github.event_name == 'schedule' && steps.schedule_changes.outputs.vtremoted || steps.filter.outputs.vtremoted }}
      vaapi_driver: ${{ github.event_name == 'schedule' && steps.schedule_changes.outputs.vaapi_driver || steps.filter.outputs.vaapi_driver }}
      obs_plugin: ${{ github.event_name == 'schedule' && steps.schedule_changes.outputs.obs_plugin || steps.filter.outputs.obs_plugin }}
      docs: ${{ github.event_name == 'schedule' && steps.schedule_changes.outputs.docs || steps.filter.outputs.docs }}
      ci: ${{ github.event_name == 'schedule' && steps.schedule_changes.outputs.ci || steps.filter.outputs.ci }}
      nightly_exists: ${{ steps.schedule_changes.outputs.nightly_exists }}
      nightly_commit: ${{ steps.schedule_changes.outputs.nightly_commit }}
      nightly_release_has_assets: ${{ steps.nightly_release.outputs.has_assets }}
      publishable: ${{ steps.publishable.outputs.value }}
      semver_tag: ${{ steps.release_ref.outputs.semver_tag }}
      release_candidate: ${{ steps.release_ref.outputs.release_candidate }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - name: Classify release ref
        id: release_ref
        run: |
          semver_tag=false
          release_candidate=false
          if [[ "${GITHUB_REF}" == refs/tags/* ]] && bash scripts/is_semver_tag.sh "${GITHUB_REF#refs/tags/}"; then
            semver_tag=true
          fi
          if [[ "${GITHUB_REF}" == refs/heads/automation/ffmpeg-sync/* ]]; then
            release_candidate=true
          fi
          printf 'semver_tag=%s\n' "${semver_tag}" >> "$GITHUB_OUTPUT"
          printf 'release_candidate=%s\n' "${release_candidate}" >> "$GITHUB_OUTPUT"
      - name: Run schedule change classifier tests
        run: |
          bash tests/test_nightly_change_classifier.sh
          bash tests/test_is_semver_tag.sh
          bash tests/test_macos_deployment_target.sh
          bash tests/test_vtremoted_package_shape.sh
          bash tests/test_ffmpeg_sync_subtree_shape.sh
          bash tests/test_next_patch_release.sh
          bash tests/test_llms_release_version.sh
          bash tests/test_parse_ffmpeg_sync_commit.sh
          bash tests/test_update_changelog_for_ffmpeg_sync.sh
      - name: Classify scheduled changes
        id: schedule_changes
        if: github.event_name == 'schedule'
        run: |
          bash scripts/classify_nightly_changes.sh nightly "${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
      - name: Check nightly release assets
        id: nightly_release
        if: github.event_name == 'schedule' && steps.schedule_changes.outputs.nightly_exists == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          asset_count="$(gh release view nightly -R "${GITHUB_REPOSITORY}" --json assets --jq '.assets | length' 2>/dev/null || echo 0)"
          if [ "${asset_count}" -gt 0 ]; then
            echo "has_assets=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_assets=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: dorny/paths-filter@v3
        id: filter
        if: github.event_name != 'schedule'
        with:
          filters: |
            ffmpeg:
              - 'ffmpeg/**'
              - 'tests/integration/**'
              - 'Makefile'
            vtremoted:
              - 'vtremoted/**'
              - 'Makefile'
            vaapi_driver:
              - 'vaapi-driver/**'
              - 'tests/integration/mock_vtremoted/mock_vtremoted.py'
              - 'Makefile'
            obs_plugin:
              - 'obs-plugin/**'
              - 'tests/integration/run_obs_plugin_client_mock.sh'
              - 'tests/integration/run_obs_plugin_integration.sh'
              - 'tests/integration/obs_plugin_client_smoke.cpp'
              - 'tests/integration/obs_plugin_integration.cpp'
              - 'tests/integration/obs_plugin_test_stubs/**'
              - 'tests/integration/mock_vtremoted/mock_vtremoted.py'
              - 'tests/integration/run_all.sh'
              - 'tests/integration/README.md'
              - 'Makefile'
            docs:
              - 'docs/**'
              - 'README.md'
            ci:
              - '.github/workflows/**'
              - 'scripts/**'
              - 'tests/test_*.sh'

      - name: Compute publishable changes
        id: publishable
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "schedule" ]; then
            publishable_changed="${{ steps.schedule_changes.outputs.publishable }}"
            nightly_exists="${{ steps.schedule_changes.outputs.nightly_exists }}"
            nightly_assets_ok="${{ steps.nightly_release.outputs.has_assets }}"
            if [ "${nightly_exists}" != "true" ] || [ "${nightly_assets_ok}" != "true" ] || [ "${publishable_changed}" = "true" ]; then
              echo "value=true" >> "$GITHUB_OUTPUT"
            else
              echo "value=false" >> "$GITHUB_OUTPUT"
            fi
          elif [ "${{ steps.filter.outputs.ffmpeg }}" = "true" ] || [ "${{ steps.filter.outputs.vtremoted }}" = "true" ] || [ "${{ steps.filter.outputs.vaapi_driver }}" = "true" ]; then
            echo "value=true" >> "$GITHUB_OUTPUT"
          else
            echo "value=false" >> "$GITHUB_OUTPUT"
          fi

  swift-macos-arm64:
    name: Swift (vtremoted) macOS arm64
    needs: changes
    if: needs.changes.outputs.release_candidate == 'true' || (github.event_name == 'schedule' && needs.changes.outputs.publishable == 'true') || (github.event_name == 'workflow_dispatch' && inputs.publish_nightly) || needs.changes.outputs.semver_tag == 'true' || (github.event_name != 'schedule' && (needs.changes.outputs.vtremoted == 'true' || needs.changes.outputs.ci == 'true'))
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Cache SwiftPM
        uses: actions/cache@v4
        with:
          path: |
            vtremoted/.build
            ~/Library/Caches/org.swift.swiftpm
            ~/Library/org.swift.swiftpm
          key: ${{ runner.os }}-swiftpm-${{ hashFiles('vtremoted/Package.swift', 'vtremoted/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-swiftpm-
      - name: Install dependencies
        run: brew install lz4 zstd pkg-config
      - name: Build vtremoted
        run: |
          make build-vtremoted
      - name: Run tests
        run: |
          cd vtremoted && swift test
      - name: Package vtremoted
        run: |
          mkdir -p dist/vtremoted
          cp vtremoted/.build/release/vtremoted dist/vtremoted/
          cp vtremoted/README.md dist/vtremoted/README.md
          cp vtremoted/install_launchd.sh dist/vtremoted/install_launchd.sh
          tar -C dist -czf vtremoted-macos-arm64.tar.gz vtremoted
          shasum -a 256 vtremoted-macos-arm64.tar.gz > vtremoted-macos-arm64.tar.gz.sha256
      - name: Smoke packaged vtremoted artifact
        run: |
          bash scripts/smoke_release_artifact.sh vtremoted vtremoted-macos-arm64.tar.gz
      - name: Upload vtremoted artifact
        uses: actions/upload-artifact@v4
        with:
          name: vtremoted-macos-arm64
          path: |
            vtremoted-macos-arm64.tar.gz
            vtremoted-macos-arm64.tar.gz.sha256

  swift-macos-x86_64:
    name: Swift (vtremoted) macOS x86_64
    needs: changes
    if: needs.changes.outputs.release_candidate == 'true' || (github.event_name == 'schedule' && needs.changes.outputs.publishable == 'true') || (github.event_name == 'workflow_dispatch' && inputs.publish_nightly) || needs.changes.outputs.semver_tag == 'true' || (github.event_name != 'schedule' && (needs.changes.outputs.vtremoted == 'true' || needs.changes.outputs.ci == 'true'))
    runs-on: macos-15-intel
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Cache SwiftPM
        uses: actions/cache@v4
        with:
          path: |
            vtremoted/.build
            ~/Library/Caches/org.swift.swiftpm
            ~/Library/org.swift.swiftpm
          key: ${{ runner.os }}-swiftpm-macos-x86_64-${{ hashFiles('vtremoted/Package.swift', 'vtremoted/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-swiftpm-macos-x86_64-
      - name: Install dependencies
        run: brew install lz4 zstd pkg-config
      - name: Build vtremoted
        run: |
          make build-vtremoted
      - name: Run tests
        run: |
          cd vtremoted && swift test
      - name: Package vtremoted
        run: |
          mkdir -p dist/vtremoted
          cp vtremoted/.build/release/vtremoted dist/vtremoted/
          cp vtremoted/README.md dist/vtremoted/README.md
          cp vtremoted/install_launchd.sh dist/vtremoted/install_launchd.sh
          tar -C dist -czf vtremoted-macos-x86_64.tar.gz vtremoted
          shasum -a 256 vtremoted-macos-x86_64.tar.gz > vtremoted-macos-x86_64.tar.gz.sha256
      - name: Smoke packaged vtremoted artifact
        run: |
          bash scripts/smoke_release_artifact.sh vtremoted vtremoted-macos-x86_64.tar.gz
      - name: Upload vtremoted artifact
        uses: actions/upload-artifact@v4
        with:
          name: vtremoted-macos-x86_64
          path: |
            vtremoted-macos-x86_64.tar.gz
            vtremoted-macos-x86_64.tar.gz.sha256

  ffmpeg-build-linux:
    name: FFmpeg (linux-x86_64)
    needs: changes
    if: >-
      (github.event_name != 'pull_request' ||
      contains(fromJSON('["davelindo", "github-actions[bot]"]'), github.event.pull_request.user.login)) &&
      (needs.changes.outputs.release_candidate == 'true' || (github.event_name == 'schedule' && needs.changes.outputs.publishable == 'true') || (github.event_name == 'workflow_dispatch' && inputs.publish_nightly) || needs.changes.outputs.semver_tag == 'true' || (github.event_name != 'schedule' && (needs.changes.outputs.ffmpeg == 'true' || needs.changes.outputs.ci == 'true')))
    runs-on: videotoolbox-remote-runner
    timeout-minutes: 45
    env:
      FFMPEG_BUILD_LABEL: linux-x86_64
    steps:
      - name: Check runner platform
        run: |
          test "${RUNNER_OS}" = "Linux"
          test "${RUNNER_ARCH}" = "X64"

      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install dependencies (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y yasm nasm pkg-config meson ninja-build cmake liblz4-dev libzstd-dev ccache \
            libaom-dev libdav1d-dev \
            libopus-dev libvorbis-dev libmp3lame-dev libx264-dev libx265-dev libvpx-dev \
            libass-dev libfreetype6-dev libfontconfig1-dev libfribidi-dev libharfbuzz-dev \
            libxml2-dev libzimg-dev libwebp-dev libsdl2-dev

      - name: Build libvmaf (Linux)
        run: |
          git clone --depth=1 --branch v3.0.0 https://github.com/Netflix/vmaf.git
          cd vmaf/libvmaf
          meson setup build --buildtype release --prefix=/usr/local
          ninja -C build
          sudo ninja -C build install
          sudo ldconfig

      - name: Build SVT-AV1 (Linux)
        run: |
          git clone --depth=1 --branch v4.0.1 https://gitlab.com/AOMediaCodec/SVT-AV1.git
          cmake -S SVT-AV1 -B svtav1-build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr/local \
            -DBUILD_SHARED_LIBS=ON
          ninja -C svtav1-build
          sudo ninja -C svtav1-build install
          sudo ldconfig

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-${{ runner.os }}-${{ env.FFMPEG_BUILD_LABEL }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ env.FFMPEG_BUILD_LABEL }}-

      - name: Configure + build (Linux)
        run: |
          export CCACHE_DIR="${GITHUB_WORKSPACE}/.ccache"
          ccache -M 2G
          ccache -z
          export CC="ccache gcc"
          export CXX="ccache g++"
          export PKG_CONFIG_PATH="/usr/local/lib/pkgconfig:/usr/local/share/pkgconfig:${PKG_CONFIG_PATH}"
          make build-ffmpeg
          ccache -s

      - name: Verify quality metrics filters (Linux)
        run: |
          ./ffmpeg/ffmpeg -hide_banner -filters | grep -Eq '(^|[[:space:]])psnr([[:space:]]|$)'
          ./ffmpeg/ffmpeg -hide_banner -filters | grep -Eq '(^|[[:space:]])ssim([[:space:]]|$)'
          ./ffmpeg/ffmpeg -hide_banner -filters | grep -Eq '(^|[[:space:]])libvmaf([[:space:]]|$)'
          ./ffmpeg/ffmpeg -hide_banner -encoders | grep -Eq '(^|[[:space:]])h264_videotoolbox_remote([[:space:]]|$)'
          ./ffmpeg/ffmpeg -hide_banner -encoders | grep -Eq '(^|[[:space:]])hevc_videotoolbox_remote([[:space:]]|$)'
          ./ffmpeg/ffmpeg -hide_banner -decoders | grep -Eq '(^|[[:space:]])h264_videotoolbox_remote([[:space:]]|$)'
          ./ffmpeg/ffmpeg -hide_banner -decoders | grep -Eq '(^|[[:space:]])hevc_videotoolbox_remote([[:space:]]|$)'
          ./ffmpeg/ffmpeg -hide_banner -bsfs | grep -Eq '(^|[[:space:]])vtremote_transcode([[:space:]]|$)'

      - name: Run mock integration tests (Linux)
        run: |
          bash tests/integration/run_mock_roundtrip.sh
          bash tests/integration/run_mock_wire_compression.sh
          bash tests/integration/run_mock_decode.sh
          bash tests/integration/run_mock_pts_dts_semantics.sh
          bash tests/integration/run_mock_transcode_pts_dts_semantics.sh
          bash tests/integration/run_mock_transcode_hvc1_hdr_signaling.sh
          bash tests/integration/run_mock_protocol_capabilities.sh
          bash tests/integration/run_mock_side_data_roundtrip.sh
          bash tests/integration/run_mock_hevc_pixfmt_negotiation.sh

      - name: Package ffmpeg (Linux)
        run: |
          mkdir -p dist
          cp ffmpeg/ffmpeg ffmpeg/ffprobe dist/
          if [ -f ffmpeg/ffplay ]; then
            cp ffmpeg/ffplay dist/
          fi
          tar -C dist -czf ffmpeg-${{ env.FFMPEG_BUILD_LABEL }}.tar.gz .
          shasum -a 256 ffmpeg-${{ env.FFMPEG_BUILD_LABEL }}.tar.gz > ffmpeg-${{ env.FFMPEG_BUILD_LABEL }}.tar.gz.sha256
      - name: Smoke packaged ffmpeg artifact (Linux)
        run: |
          bash scripts/smoke_release_artifact.sh ffmpeg ffmpeg-${{ env.FFMPEG_BUILD_LABEL }}.tar.gz

      - name: Upload ffmpeg artifact
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-${{ env.FFMPEG_BUILD_LABEL }}
          path: |
            ffmpeg-${{ env.FFMPEG_BUILD_LABEL }}.tar.gz
            ffmpeg-${{ env.FFMPEG_BUILD_LABEL }}.tar.gz.sha256

  ffmpeg-build:
    name: FFmpeg (${{ matrix.label }})
    needs: changes
    if: needs.changes.outputs.release_candidate == 'true' || (github.event_name == 'schedule' && needs.changes.outputs.publishable == 'true') || (github.event_name == 'workflow_dispatch' && inputs.publish_nightly) || needs.changes.outputs.semver_tag == 'true' || (github.event_name != 'schedule' && (needs.changes.outputs.ffmpeg == 'true' || needs.changes.outputs.ci == 'true'))
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: windows-x86_64
          - os: macos-15-intel
            label: macos-x86_64
          - os: macos-14
            label: macos-arm64
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install lz4 zstd libvmaf aom dav1d svt-av1 pkg-config yasm nasm ccache opus libvorbis lame x264 x265 libvpx libass freetype fontconfig fribidi harfbuzz libxml2 zimg webp sdl2

      - name: Install dependencies (Windows/MSYS2)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            base-devel
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-pkg-config
            mingw-w64-x86_64-lz4
            mingw-w64-x86_64-zstd
            mingw-w64-x86_64-vmaf
            mingw-w64-x86_64-aom
            mingw-w64-x86_64-dav1d
            mingw-w64-x86_64-svt-av1
            mingw-w64-x86_64-nasm
            mingw-w64-x86_64-yasm
            mingw-w64-x86_64-ccache
            mingw-w64-x86_64-opus
            mingw-w64-x86_64-libvorbis
            mingw-w64-x86_64-lame
            mingw-w64-x86_64-x264
            mingw-w64-x86_64-x265
            mingw-w64-x86_64-libvpx
            mingw-w64-x86_64-libass
            mingw-w64-x86_64-freetype
            mingw-w64-x86_64-fontconfig
            mingw-w64-x86_64-fribidi
            mingw-w64-x86_64-harfbuzz
            mingw-w64-x86_64-libxml2
            mingw-w64-x86_64-zimg
            mingw-w64-x86_64-libwebp
            mingw-w64-x86_64-SDL2

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-${{ runner.os }}-${{ matrix.label }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ matrix.label }}-

      - name: Configure + build (macOS)
        if: runner.os == 'macOS'
        run: |
          export CCACHE_DIR="${GITHUB_WORKSPACE}/.ccache"
          ccache -M 2G
          ccache -z
          export CC="ccache clang"
          export CXX="ccache clang++"
          BREW_PKGS="lz4 zstd libvmaf aom dav1d svt-av1 opus libvorbis lame x264 x265 libvpx libass freetype fontconfig fribidi harfbuzz libxml2 zimg webp sdl2"
          for p in $BREW_PKGS; do
            prefix="$(brew --prefix "$p")"
            export PKG_CONFIG_PATH="${prefix}/lib/pkgconfig:${PKG_CONFIG_PATH}"
          done
          export PKG_CONFIG_PATH="$(brew --prefix)/lib/pkgconfig:${PKG_CONFIG_PATH}"
          export CPPFLAGS="-I$(brew --prefix)/include ${CPPFLAGS}"
          export LDFLAGS="-L$(brew --prefix)/lib ${LDFLAGS}"
          make build-ffmpeg
          ccache -s

      - name: Verify quality metrics filters (macOS)
        if: runner.os == 'macOS'
        run: |
          ./ffmpeg/ffmpeg -hide_banner -filters | grep -Eq '(^|[[:space:]])psnr([[:space:]]|$)'
          ./ffmpeg/ffmpeg -hide_banner -filters | grep -Eq '(^|[[:space:]])ssim([[:space:]]|$)'
          ./ffmpeg/ffmpeg -hide_banner -filters | grep -Eq '(^|[[:space:]])libvmaf([[:space:]]|$)'
          ./ffmpeg/ffmpeg -hide_banner -encoders | grep -Eq '(^|[[:space:]])h264_videotoolbox_remote([[:space:]]|$)'
          ./ffmpeg/ffmpeg -hide_banner -encoders | grep -Eq '(^|[[:space:]])hevc_videotoolbox_remote([[:space:]]|$)'
          ./ffmpeg/ffmpeg -hide_banner -decoders | grep -Eq '(^|[[:space:]])h264_videotoolbox_remote([[:space:]]|$)'
          ./ffmpeg/ffmpeg -hide_banner -decoders | grep -Eq '(^|[[:space:]])hevc_videotoolbox_remote([[:space:]]|$)'
          ./ffmpeg/ffmpeg -hide_banner -bsfs | grep -Eq '(^|[[:space:]])vtremote_transcode([[:space:]]|$)'

      - name: Package ffmpeg (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir -p dist
          cp ffmpeg/ffmpeg ffmpeg/ffprobe dist/
          if [ -f ffmpeg/ffplay ]; then
            cp ffmpeg/ffplay dist/
          fi
          tar -C dist -czf ffmpeg-${{ matrix.label }}.tar.gz .
          shasum -a 256 ffmpeg-${{ matrix.label }}.tar.gz > ffmpeg-${{ matrix.label }}.tar.gz.sha256
      - name: Smoke packaged ffmpeg artifact (macOS)
        if: runner.os == 'macOS'
        run: |
          bash scripts/smoke_release_artifact.sh ffmpeg ffmpeg-${{ matrix.label }}.tar.gz

      - name: Configure + build (Windows/MSYS2)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          export CCACHE_DIR="${GITHUB_WORKSPACE}/.ccache"
          ccache -M 2G
          ccache -z
          export CC="ccache gcc"
          export CXX="ccache g++"
          make build-ffmpeg
          ccache -s

      - name: Verify quality metrics filters (Windows/MSYS2)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          ./ffmpeg/ffmpeg.exe -hide_banner -filters | grep -Eq '(^|[[:space:]])psnr([[:space:]]|$)'
          ./ffmpeg/ffmpeg.exe -hide_banner -filters | grep -Eq '(^|[[:space:]])ssim([[:space:]]|$)'
          ./ffmpeg/ffmpeg.exe -hide_banner -filters | grep -Eq '(^|[[:space:]])libvmaf([[:space:]]|$)'
      - name: Package ffmpeg (Windows/MSYS2)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          mkdir -p dist
          cp ffmpeg/ffmpeg.exe ffmpeg/ffprobe.exe dist/
          if [ -f ffmpeg/ffplay.exe ]; then
            cp ffmpeg/ffplay.exe dist/
          fi
          tar -C dist -czf ffmpeg-${{ matrix.label }}.tar.gz .
          sha256sum ffmpeg-${{ matrix.label }}.tar.gz > ffmpeg-${{ matrix.label }}.tar.gz.sha256
      - name: Smoke packaged ffmpeg artifact (Windows/MSYS2)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          bash scripts/smoke_release_artifact.sh ffmpeg ffmpeg-${{ matrix.label }}.tar.gz

      - name: Upload ffmpeg artifact
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-${{ matrix.label }}
          path: |
            ffmpeg-${{ matrix.label }}.tar.gz
            ffmpeg-${{ matrix.label }}.tar.gz.sha256

  vaapi-driver-linux:
    name: VA-API driver (linux-x86_64)
    needs: changes
    if: needs.changes.outputs.release_candidate == 'true' || (github.event_name == 'schedule' && needs.changes.outputs.publishable == 'true') || (github.event_name == 'workflow_dispatch' && inputs.publish_nightly) || needs.changes.outputs.semver_tag == 'true' || (github.event_name != 'schedule' && (needs.changes.outputs.vaapi_driver == 'true' || needs.changes.outputs.ci == 'true'))
    runs-on: ubuntu-24.04
    # Build release binaries before glibc's pthread merge so the package keeps
    # its advertised GLIBC 2.17 ceiling. libva 2.22 is installed below because
    # Ubuntu 20.04's packaged headers predate the required VA-API 1.22 ABI.
    container: ubuntu:20.04
    timeout-minutes: 15
    steps:
      - name: Install build and test dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential gcc-10 cmake pkg-config python3 ffmpeg git binutils curl \
            meson ninja-build libdrm-dev libx11-dev libxext-dev libxfixes-dev \
            libx11-xcb-dev libxcb1-dev libxcb-dri3-dev \
            liblz4-dev libzstd-dev ca-certificates
      - name: Install libva 2.22
        run: |
          curl -fL --retry 3 -o /tmp/libva.tar.gz \
            https://github.com/intel/libva/archive/refs/tags/2.22.0.tar.gz
          echo "467c418c2640a178c6baad5be2e00d569842123763b80507721ab87eb7af8735  /tmp/libva.tar.gz" \
            | sha256sum -c -
          tar -xzf /tmp/libva.tar.gz -C /tmp
          meson setup /tmp/libva-build /tmp/libva-2.22.0 \
            --prefix=/usr/local --libdir=lib \
            -Dwith_x11=yes -Dwith_glx=no -Dwith_wayland=no -Denable_docs=false
          ninja -C /tmp/libva-build install
          ldconfig
          echo "PKG_CONFIG_PATH=/usr/local/lib/pkgconfig" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - name: Verify VA-API baseline
        run: |
          test "$(uname -m)" = x86_64
          pkg-config --atleast-version=1.22 libva
      - name: Build, test, and package
        run: |
          version="$(git describe --tags --always --dirty | sed 's/^v//')"
          make test-vaapi-driver VTREMOTE_VERSION="$version"
          cmake -S vaapi-driver -B vaapi-driver/build-analyzer \
            -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTING=OFF \
            -DVTREMOTE_WARNINGS_AS_ERRORS=ON -DCMAKE_C_COMPILER=gcc-10 \
            -DCMAKE_C_FLAGS=-fanalyzer
          cmake --build vaapi-driver/build-analyzer --parallel
          cmake -S vaapi-driver -B vaapi-driver/build-sanitized \
            -DCMAKE_BUILD_TYPE=Debug \
            -DVTREMOTE_WARNINGS_AS_ERRORS=ON \
            -DVTREMOTE_ENABLE_STOCK_FFMPEG_TEST=OFF \
            -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined" \
            -DCMAKE_SHARED_LINKER_FLAGS="-fsanitize=address,undefined"
          cmake --build vaapi-driver/build-sanitized --parallel
          (cd vaapi-driver/build-sanitized && \
            ASAN_OPTIONS=detect_leaks=1 ctest --output-on-failure)
          make package-vaapi-driver VTREMOTE_VERSION="$version"
          VERSION="$version" vaapi-driver/scripts/package-source.sh
      - name: Smoke packaged VA-API artifact
        run: |
          bash scripts/smoke_release_artifact.sh vaapi-driver \
            vaapi-driver/dist/vtremote-vaapi-linux-x86_64.tar.gz
          tar -tzf vaapi-driver/dist/vtremote-vaapi-*-source.tar.gz \
            > vaapi-driver-source-contents.txt
          grep -q '/src/va_driver.c$' vaapi-driver-source-contents.txt
      - name: Upload VA-API artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vtremote-vaapi-linux-x86_64
          path: |
            vaapi-driver/dist/vtremote-vaapi-linux-x86_64.tar.gz
            vaapi-driver/dist/vtremote-vaapi-linux-x86_64.tar.gz.sha256
            vaapi-driver/dist/vtremote-vaapi-*-source.tar.gz
            vaapi-driver/dist/vtremote-vaapi-*-source.tar.gz.sha256

  obs-plugin:
    name: OBS plugin tests (Linux)
    needs: changes
    if: >-
      (github.event_name != 'pull_request' ||
      contains(fromJSON('["davelindo", "github-actions[bot]"]'), github.event.pull_request.user.login)) &&
      (needs.changes.outputs.release_candidate == 'true' || (github.event_name == 'workflow_dispatch' && inputs.publish_nightly) || needs.changes.outputs.semver_tag == 'true' || (github.event_name != 'schedule' && (needs.changes.outputs.obs_plugin == 'true' || needs.changes.outputs.ci == 'true')))
    runs-on: videotoolbox-remote-runner
    steps:
      - name: Check runner platform
        run: |
          test "${RUNNER_OS}" = "Linux"
          test "${RUNNER_ARCH}" = "X64"

      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ pkg-config liblz4-dev libzstd-dev libobs-dev python3 xvfb xauth
      - name: Run OBS plugin tests
        run: |
          make test-obs-plugin

  retag-nightly:
    name: Refresh nightly metadata
    needs: changes
    runs-on: videotoolbox-remote-runner
    if: github.event_name == 'schedule' && needs.changes.outputs.publishable != 'true'
    permissions:
      contents: write
    steps:
      - name: Check runner platform
        run: |
          test "${RUNNER_OS}" = "Linux"
          test "${RUNNER_ARCH}" = "X64"

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Install GitHub CLI
        run: bash scripts/install_github_cli.sh
      - name: Refresh nightly-main tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f nightly-main "${GITHUB_SHA}"
          git push --force origin "refs/tags/nightly-main"
      - name: Update nightly release body
        env:
          GH_TOKEN: ${{ github.token }}
          NIGHTLY_ASSET_COMMIT: ${{ needs.changes.outputs.nightly_commit }}
          NIGHTLY_HEAD_COMMIT: ${{ github.sha }}
          NIGHTLY_HEAD_TAG: nightly-main
          NIGHTLY_ASSETS_STALE: "true"
        run: |
          bash scripts/apply_release_notes.sh nightly "${GITHUB_REPOSITORY}"

  publish-assets:
    name: Publish nightly / release assets
    runs-on: videotoolbox-remote-runner
    needs: [changes, swift-macos-arm64, swift-macos-x86_64, ffmpeg-build-linux, ffmpeg-build, vaapi-driver-linux]
    if: github.event_name != 'pull_request' && ((github.event_name == 'schedule' && needs.changes.outputs.publishable == 'true') || (github.event_name == 'workflow_dispatch' && inputs.publish_nightly) || needs.changes.outputs.semver_tag == 'true')
    permissions:
      contents: write
    steps:
      - name: Check runner platform
        run: |
          test "${RUNNER_OS}" = "Linux"
          test "${RUNNER_ARCH}" = "X64"

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Install GitHub CLI
        run: bash scripts/install_github_cli.sh
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release_assets
      - name: Flatten artifacts
        run: |
          mkdir -p release_flat
          find release_assets -type f -maxdepth 3 -print -exec cp {} release_flat/ \;
          cd release_flat
          sha256sum *.tar.gz > SHA256SUMS.txt
      - name: Select release tag
        env:
          PUBLISH_NIGHTLY: ${{ inputs.publish_nightly }}
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "schedule" ] || { [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ] && [ "${PUBLISH_NIGHTLY}" = "true" ]; }; then
            release_tag=nightly
          else
            release_tag="${GITHUB_REF#refs/tags/}"
          fi
          echo "RELEASE_TAG=${release_tag}" >> "$GITHUB_ENV"
      - name: Publish nightly release
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.publish_nightly)
        uses: ncipollo/release-action@v1
        with:
          tag: nightly
          name: Nightly
          prerelease: true
          allowUpdates: true
          artifacts: "release_flat/*"
          artifactErrorsFailBuild: true
          makeLatest: false
          commit: ${{ github.sha }}
      - name: Publish tagged release
        if: needs.changes.outputs.semver_tag == 'true'
        uses: ncipollo/release-action@v1
        with:
          allowUpdates: true
          artifacts: "release_flat/*"
          artifactErrorsFailBuild: true
      - name: Refresh nightly-main tag
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.publish_nightly)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f nightly-main "${GITHUB_SHA}"
          git push --force origin "refs/tags/nightly-main"
      - name: Update release body
        env:
          GH_TOKEN: ${{ github.token }}
          NIGHTLY_ASSET_COMMIT: ${{ github.sha }}
          NIGHTLY_HEAD_COMMIT: ${{ github.sha }}
          NIGHTLY_HEAD_TAG: nightly-main
        run: |
          bash scripts/apply_release_notes.sh "${RELEASE_TAG}" "${GITHUB_REPOSITORY}"
