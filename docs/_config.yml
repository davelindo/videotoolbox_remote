title: VideoToolbox Remote
description: "Produce video on any PC and use a Mac for hardware encoding. NV12/P010 capture, H.264/HEVC transcoding, Plex, FFmpeg, VA-API and OBS over the network."
current_release: "v0.10.13"
latest_release_url: "https://github.com/davelindo/videotoolbox_remote/releases/latest"
repository_url: "https://github.com/davelindo/videotoolbox_remote"
markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false
baseurl: "/videotoolbox_remote"
url: "https://davelindo.github.io"
plugins:
  - jekyll-sitemap
exclude:
  - assets/vendor/README.md
defaults:
  - scope:
      path: ""
    values:
      layout: default
