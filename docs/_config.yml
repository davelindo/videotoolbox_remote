title: VideoToolbox Remote
description: "Keep Plex on Linux and offload high-quality H.264/HEVC transcodes to a Mac's efficient VideoToolbox hardware over LAN. FFmpeg, VA-API and experimental OBS."
current_release: "v0.9.20"
latest_release_url: "https://github.com/davelindo/videotoolbox_remote/releases/latest"
repository_url: "https://github.com/davelindo/videotoolbox_remote"
markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false
baseurl: "/videotoolbox_remote"
url: "https://davelindo.github.io"
plugins:
  - jekyll-sitemap
exclude:
  - assets/vendor/README.md
defaults:
  - scope:
      path: ""
    values:
      layout: default
